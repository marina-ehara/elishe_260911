        body {

        /* LP全体を囲むコンテナ。中央寄せにし、最大幅を設ける */
        .lp-container {

        /* ＝＝＝ ここからカルーセル用のスタイル ＝＝＝ */
        .carousel-wrapper {

            width: 100%;
            overflow: hidden; /* 枠外にはみ出た画像を隠す */
        }
        
        .carousel-track {
            display: flex;
            width: 100%;
            cursor: grab; /* マウスカーソルをつかむ手に */
        }
        
        .carousel-track:active {
            cursor: grabbing; /* クリック中は握った手に */
        }
        
        /* カルーセル内の画像が縮まないように設定し、ブラウザ標準のドラッグを無効化 */
        .carousel-track img {
            min-width: 100%;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-user-select: none;
        }
        
        /* ドットナビゲーション（グレー＆少し小さく） */
        .carousel-dots {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px; /* ドットの間隔 */

        }
        .dot {

            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .dot.active {

        }
        /* ＝＝＝ カルーセル用スタイルここまで ＝＝＝ */
    </style>

    <script>
        // ページ内のすべてのカルーセルを取得して、それぞれをセットアップする
        document.querySelectorAll('.carousel-wrapper').forEach(wrapper => {
            const track = wrapper.querySelector('.carousel-track');
            const images = Array.from(track.children);
            const originalLength = images.length;
            const dotsContainer = wrapper.querySelector('.carousel-dots');

            // 1. ドットを画像の枚数分だけ自動生成する
            for (let i = 0; i < originalLength; i++) {
                const dot = document.createElement('span');
                dot.classList.add('dot');
                if (i === 0) dot.classList.add('active'); // 最初のドットをアクティブに
                
                // ドットをクリックした時の処理
                dot.addEventListener('click', () => {
                    currentSlide(i);
                });
                dotsContainer.appendChild(dot);
            }
            const dots = Array.from(dotsContainer.children);

            // 2. 無限ループ用に最初と最後の画像を複製（クローン）して追加
            const firstClone = images[0].cloneNode(true);
            const lastClone = images[originalLength - 1].cloneNode(true);
            track.appendChild(firstClone);
            track.insertBefore(lastClone, images[0]);

            let slideIndex = 1; // クローンを追加したので1からスタート
            let isDragging = false;
            let startPos = 0;
            let autoSlideInterval;

            // 初期位置に移動（アニメーションなし）
            track.style.transform = `translateX(-${slideIndex * 100}%)`;

            // スライドを動かす処理
            function updateSlide() {
                track.style.transition = "transform 0.4s ease-in-out";
                track.style.transform = `translateX(-${slideIndex * 100}%)`;

                // ドットの表示切替
                let dotIndex = slideIndex - 1;
                if (dotIndex === originalLength) dotIndex = 0;
                if (dotIndex < 0) dotIndex = originalLength - 1;
                
                dots.forEach(dot => dot.classList.remove('active'));
                if (dots[dotIndex]) {
                    dots[dotIndex].classList.add('active');
                }
            }

            // 次へ進む
            function nextSlide() {
                if (slideIndex >= originalLength + 1) return;
                slideIndex++;
                updateSlide();
            }
            
            // 前へ戻る
            function prevSlide() {
                if (slideIndex <= 0) return;
                slideIndex--;
                updateSlide();
            }

            // アニメーションが終わったタイミングで、クローンならこっそり本物にすり替える
            track.addEventListener('transitionend', () => {
                const currentImage = track.children[slideIndex];
                if (currentImage === firstClone) {
                    track.style.transition = "none";
                    slideIndex = 1;
                    track.style.transform = `translateX(-${slideIndex * 100}%)`;
                }
                if (currentImage === lastClone) {
                    track.style.transition = "none";
                    slideIndex = originalLength;
                    track.style.transform = `translateX(-${slideIndex * 100}%)`;
                }
            });

            // ＝＝ 手動スワイプ・ドラッグ機能 ＝＝
            track.addEventListener('touchstart', touchStart, { passive: true });
            track.addEventListener('touchend', touchEnd);
            track.addEventListener('touchmove', touchMove, { passive: true });
            track.addEventListener('mousedown', touchStart);
            track.addEventListener('mouseup', touchEnd);
            track.addEventListener('mouseleave', touchEnd);
            track.addEventListener('mousemove', touchMove);

            function touchStart(e) {
                clearInterval(autoSlideInterval);
                startPos = getPositionX(e);
                isDragging = true;
                track.style.transition = "none";
            }

            function touchMove(e) {
                if (!isDragging) return;
                const currentPosition = getPositionX(e);
                const diff = currentPosition - startPos;
                const slideWidth = track.clientWidth;
                const movePercent = (diff / slideWidth) * 100;
                track.style.transform = `translateX(calc(-${slideIndex * 100}% + ${movePercent}%))`;
            }

            function touchEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                
                const endPos = e.type.includes('mouse') ? e.pageX : (e.changedTouches ? e.changedTouches[0].clientX : startPos);
                const diff = endPos - startPos;

                if (diff < -50) {
                    nextSlide();
                } else if (diff > 50) {
                    prevSlide();
                } else {
                    updateSlide();
                }
                startAutoSlide();
            }

            function getPositionX(e) {
                return e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
            }

            function currentSlide(index) {
                clearInterval(autoSlideInterval);
                slideIndex = index + 1;
                updateSlide();
                startAutoSlide();
            }

            function startAutoSlide() {
                clearInterval(autoSlideInterval);
                autoSlideInterval = setInterval(nextSlide, 1500);
            }

            // 初期ロード時に自動スライド開始
            startAutoSlide();
        });
    </script>
