<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elishe 2026AW COLLECTION</title>
    <style>
        /* ブラウザのデフォルトの余白をリセット */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
        
        /* LP全体を囲むコンテナ。中央寄せにし、最大幅を設ける */
        .lp-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* 画像の下に隙間ができないようにブロック要素にし、幅を100%にする */
        .lp-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            border: none;
        }

        /* ＝＝＝ ここからカルーセル用のスタイル ＝＝＝ */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden; /* 枠外にはみ出た画像を隠す */
        }
        
        .carousel-track {
            display: flex;
            width: 100%;
            cursor: grab; /* マウスカーソルをつかむ手に */
        }
        
        .carousel-track:active {
            cursor: grabbing; /* クリック中は握った手に */
        }
        
        /* カルーセル内の画像が縮まないように設定し、ブラウザ標準のドラッグを無効化 */
        .carousel-track img {
            min-width: 100%;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-user-select: none;
        }
        
        /* ドットナビゲーション（グレー＆少し小さく） */
        .carousel-dots {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px; /* ドットの間隔 */
            z-index: 10;
        }
        .dot {
            width: 8px; /* サイズ */
            height: 8px;
            background-color: #cccccc; /* 薄いグレー（非アクティブ時） */
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .dot.active {
            background-color: #666666; /* 濃いグレー（現在表示中の画像） */
        }
        /* ＝＝＝ カルーセル用スタイルここまで ＝＝＝ */
    </style>
</head>
<body>
    <div class="lp-container">
        <img src="LP_ELISHE_260911_01.jpg" alt="Elishe 2026AW COLLECTION vol.01">
        
        <img src="LP_ELISHE_260911_02.jpg" alt="Modern Duality LOOK 1">
        
        <!-- LOOK1 -->
        <img src="LP_ELISHE_260911_03.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_04.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        
        <!-- LOOK2 画像 -->
        <img src="LP_ELISHE_260911_05.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_06.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        
        <!-- LOOK3 画像 -->
        <img src="LP_ELISHE_260911_07.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_08.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">

        <!-- LOOK4 画像 -->
        <img src="LP_ELISHE_260911_09.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_10.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">

        <!-- LOOK5 画像 -->
        <img src="LP_ELISHE_260911_11.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_12.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">

        <!-- カラバリ画像（無限ループ＆スワイプ対応スライド） -->
        <div class="carousel-wrapper">
            <div class="carousel-track" id="carouselTrack">
                <img src="LP_ELISHE_260911_13.png" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
                <img src="LP_ELISHE_260911_13-03.png" alt="Elishe エリシェ Elishe 2026AW COLLECTION">

            </div>
            
            <div class="carousel-dots">
                <span class="dot active" onclick="currentSlide(0)"></span>
                <span class="dot" onclick="currentSlide(1)"></span>
                <span class="dot" onclick="currentSlide(2)"></span>
            </div>
        </div>

        <!-- カルーセルに入れなかった静止画 -->
        <img src="LP_ELISHE_260911_14.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_16.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        
        <!-- オンラインチェック（フッター部） -->
        <img src="LP_ELISHE_260911_18.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_19.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
    </div>

    <!-- ＝＝＝ カルーセルを動かすためのJavaScript ＝＝＝ -->
    <script>
        const track = document.getElementById('carouselTrack');
        const images = Array.from(track.children);
        const dots = document.querySelectorAll('.dot');
        const originalLength = images.length;

        // 無限ループ用に最初と最後の画像を複製（クローン）して追加
        const firstClone = images[0].cloneNode(true);
        const lastClone = images[originalLength - 1].cloneNode(true);
        track.appendChild(firstClone);
        track.insertBefore(lastClone, images[0]);

        let slideIndex = 1; // クローンを追加したので1からスタート
        let isDragging = false;
        let startPos = 0;
        let autoSlideInterval;

        // 初期位置に移動（アニメーションなし）
        track.style.transform = `translateX(-${slideIndex * 100}%)`;

        // スライドを動かす処理
        function updateSlide() {
            track.style.transition = "transform 0.4s ease-in-out";
            track.style.transform = `translateX(-${slideIndex * 100}%)`;

            // ドットの表示切替
            let dotIndex = slideIndex - 1;
            if (dotIndex === originalLength) dotIndex = 0;
            if (dotIndex < 0) dotIndex = originalLength - 1;
            
            dots.forEach(dot => dot.classList.remove('active'));
            dots[dotIndex].classList.add('active');
        }

        // 次へ・前へ進む
        function nextSlide() {
            if (slideIndex >= originalLength + 1) return;
            slideIndex++;
            updateSlide();
        }
        
        function prevSlide() {
            if (slideIndex <= 0) return;
            slideIndex--;
            updateSlide();
        }

        // アニメーションが終わったタイミングで、クローンならこっそり本物にすり替える
        track.addEventListener('transitionend', () => {
            if (track.children[slideIndex] === firstClone) {
                track.style.transition = "none";
                slideIndex = 1;
                track.style.transform = `translateX(-${slideIndex * 100}%)`;
            }
            if (track.children[slideIndex] === lastClone) {
                track.style.transition = "none";
                slideIndex = originalLength;
                track.style.transform = `translateX(-${slideIndex * 100}%)`;
            }
        });

        // ＝＝ 手動スワイプ・ドラッグ機能 ＝＝
        track.addEventListener('touchstart', touchStart);
        track.addEventListener('touchend', touchEnd);
        track.addEventListener('touchmove', touchMove);
        track.addEventListener('mousedown', touchStart);
        track.addEventListener('mouseup', touchEnd);
        track.addEventListener('mouseleave', touchEnd);
        track.addEventListener('mousemove', touchMove);

        function touchStart(e) {
            clearInterval(autoSlideInterval); // 操作中は自動再生ストップ
            startPos = getPositionX(e);
            isDragging = true;
            track.style.transition = "none"; // 操作中はアニメーションを切る
        }

        function touchMove(e) {
            if (!isDragging) return;
            const currentPosition = getPositionX(e);
            const diff = currentPosition - startPos;
            const slideWidth = track.clientWidth;
            const movePercent = (diff / slideWidth) * 100;
            // 指の動きに合わせて追従させる
            track.style.transform = `translateX(calc(-${slideIndex * 100}% + ${movePercent}%))`;
        }

        function touchEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            
            const endPos = e.type.includes('mouse') ? e.pageX : (e.changedTouches ? e.changedTouches[0].clientX : startPos);
            const diff = endPos - startPos;

            // 一定の距離（50px）動かしたらスライドを切り替える
            if (diff < -50) {
                nextSlide();
            } else if (diff > 50) {
                prevSlide();
            } else {
                updateSlide(); // 動かし足りない場合は元の位置に戻る
            }
            startAutoSlide(); // 操作が終わったら自動再生を再開
        }

        // X座標の取得（PCマウスとスマホタッチ両対応）
        function getPositionX(e) {
            return e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
        }

        // ドットボタンを押した時の処理
        function currentSlide(index) {
            clearInterval(autoSlideInterval);
            slideIndex = index + 1; // クローン分ズレているので +1 する
            updateSlide();
            startAutoSlide();
        }

        // 自動再生を開始する関数
        function startAutoSlide() {
            clearInterval(autoSlideInterval);
            autoSlideInterval = setInterval(nextSlide, 1500); // 1.5秒間隔
        }

        // ページ読み込み時に自動再生スタート
        startAutoSlide();
    </script>
</body>
</html>
