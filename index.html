<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elishe 2026AW COLLECTION</title>
    <style>
        /* ブラウザのデフォルトの余白をリセット */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
        
        /* LP全体を囲むコンテナ。中央寄せにし、最大幅を設ける */
        .lp-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* 画像の下に隙間ができないようにブロック要素にし、幅を100%にする */
        .lp-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            border: none;
        }

        /* ＝＝＝ ここからカルーセル用のスタイル ＝＝＝ */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden; /* 枠外にはみ出た画像を隠す */
        }
        
        .carousel-track {
            display: flex;
            transition: transform 0.4s ease-in-out; /* スライドのアニメーション速度 */
            width: 100%;
        }
        
        /* カルーセル内の画像が縮まないように設定 */
        .carousel-track img {
            min-width: 100%;
            flex-shrink: 0;
        }

        /* 左右の操作ボタン */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.3);
            color: #fff;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
        }
        .carousel-btn:hover {
            background-color: rgba(0, 0, 0, 0.6);
        }
        .carousel-btn.prev { left: 0; }
        .carousel-btn.next { right: 0; }
        
        /* ドットナビゲーション */
        .carousel-dots {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }
        .dot {
            width: 12px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
        }
        .dot.active {
            background-color: rgba(255, 255, 255, 1);
        }
        /* ＝＝＝ カルーセル用スタイルここまで ＝＝＝ */
    </style>
</head>
<body>
    <div class="lp-container">
        <img src="LP_ELISHE_260911_01.jpg" alt="Elishe 2026AW COLLECTION vol.01">
        
        <img src="LP_ELISHE_260911_02.jpg" alt="Modern Duality LOOK 1">
        
        <img src="LP_ELISHE_260911_03.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_04.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        
        <img src="LP_ELISHE_260911_05.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_06.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        
        <img src="LP_ELISHE_260911_07.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_08.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">

        <img src="LP_ELISHE_260911_09.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_10.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">

        <img src="LP_ELISHE_260911_11.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_12.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">

        <div class="carousel-wrapper">
            <div class="carousel-track" id="carouselTrack">
                <img src="LP_ELISHE_260911_13.png" alt="Elishe カラバリ 1">
                <img src="LP_ELISHE_260911_15.png" alt="Elishe カラバリ 2">
                <img src="LP_ELISHE_260911_17.png" alt="Elishe カラバリ 3">
            </div>
            
            <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
            <button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
            
            <div class="carousel-dots">
                <span class="dot active" onclick="currentSlide(0)"></span>
                <span class="dot" onclick="currentSlide(1)"></span>
                <span class="dot" onclick="currentSlide(2)"></span>
            </div>
        </div>

        <img src="LP_ELISHE_260911_14.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_16.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        
        <img src="LP_ELISHE_260911_18.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
        <img src="LP_ELISHE_260911_19.jpg" alt="Elishe エリシェ Elishe 2026AW COLLECTION">
    </div>

    <script>
        let slideIndex = 0;
        const track = document.getElementById('carouselTrack');
        const dots = document.querySelectorAll('.dot');
        const totalSlides = track.children.length;

        function updateSlide() {
            // スライドの横移動（インデックス × 100%分マイナス方向へずらす）
            track.style.transform = `translateX(-${slideIndex * 100}%)`;
            
            // ドットの白黒を更新
            dots.forEach(dot => dot.classList.remove('active'));
            dots[slideIndex].classList.add('active');
        }

        function moveSlide(step) {
            slideIndex += step;
            
            // 最後の画像の次は最初へ、最初の画像の前は最後へループさせる
            if (slideIndex >= totalSlides) {
                slideIndex = 0;
            } else if (slideIndex < 0) {
                slideIndex = totalSlides - 1;
            }
            updateSlide();
        }

        function currentSlide(index) {
            slideIndex = index;
            updateSlide();
        }
        
        // もし数秒ごとに自動でスライドさせたい場合は、以下の2行の「//」を消してください。
        // setInterval(() => { moveSlide(1); }, 4000);
    </script>
</body>
</html>
